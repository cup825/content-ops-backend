spring.application.name=content-ops-backend

# AWS MySQL Configuration
# 敏感配置通过环境变量注入，格式: export DB_URL=jdbc:mysql://...
spring.datasource.url=${DB_URL:jdbc:mysql://content-ops-db.cls4iu48883e.eu-north-1.rds.amazonaws.com:3306/content-ops-db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Exception Handler Configuration
# spring.mvc.throw-exception-if-no-handler-found 在 Spring Boot 3.x 已弃用，默认行为已满足需求
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false

# ?????????JWT???????
logging.level.com.bytedance.content.common.security=DEBUG
logging.level.com.bytedance.content.admin.service=DEBUG

# JWT Configuration（从环境变量注入，生产环境必须设置 JWT_SECRET）
app.jwtSecret=${JWT_SECRET:mySecretKeyThatIsLongEnoughFor256BitHS256AlgorithmHereWithMinimumLength}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
